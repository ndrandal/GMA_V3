# GMA default runtime config
# Load via: ./gma_server <wsPort> gma.conf [feedPort]

# Server
wsPort = 4000
feedPort = 9001

# Thread pool (0 = hardware_concurrency)
threadPoolSize = 4

# Logging
logLevel = info

# Metrics reporter
metricsEnabled = true
metricsIntervalSec = 15

# TA history cap
taHistoryMax = 1000

# Derived-atomic key shape (ENC-1008). false = builtins are stored under the
# bare function name (`mean`), one slot per symbol shared by every field, so
# two fields driving the same builtin overwrite each other. true = store them
# as `<field>.<fn>` (`lastPrice.mean`) instead.
#
# This key is client-visible — `field` in a WS subscribe is the same string —
# so flipping it breaks any AtomicAccessor bound to a bare builtin name.
# Listener push is unchanged in both states. Read
# docs/atomic-keys.md#derived-atomic-key-shape--atomickeynamespacebyfield-enc-1008
# before turning it on.
atomicKeyNamespaceByField = false

# TA indicator periods (comma-separated)
taSMA = 5,10,20,50
taEMA = 9,21,50
taRSI = 14
taATR = 14
taMomentum = 10
taVolAvg = 20

# MACD
taMACD_fast = 12
taMACD_slow = 26
taMACD_signal = 9

# Bollinger Bands
taBBands_n = 20
taBBands_stdK = 2.0
